# Tipos, tests unitarios, tests contra Postgres 18 real y build de la imagen (docs/testing.md).
# El check "ci" es obligatorio para mergear en main, y tiene que estar en verde antes de
# correr la revisión de Codex (CONTRIBUTING.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: server_version de Postgres
        run: psql "$TEST_PG_URL" -Atc 'show server_version'
      - run: pnpm test:db
      # Desde el checkout limpio: la imagen se arma solo con lo versionado.
      - name: Imagen de Docker
        run: docker build .
