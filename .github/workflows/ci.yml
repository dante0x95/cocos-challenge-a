# Tipos, tests unitarios, tests contra Postgres 18 real, compatibilidad con el release anterior,
# build de la imagen y el smoke funcional contra esa imagen levantada como en el deploy
# (docs/testing.md).
# El check "ci" es obligatorio para mergear en main, y tiene que estar en verde antes de
# correr la revisión de Codex (CONTRIBUTING.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # La historia y los tags: la compatibilidad con el release anterior lo busca.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # test/unit/ops-commands corre los comandos de operación en zsh, la terminal de macOS.
      - name: zsh para test/unit/ops-commands
        run: command -v zsh || { sudo apt-get update -q && sudo apt-get install -y -q zsh; }
      - run: pnpm test:unit
      - name: server_version de Postgres
        run: psql "$TEST_PG_URL" -Atc 'show server_version'
      - run: pnpm test:db
      # La API del último release vX.Y.Z escribe sobre la base que deja HEAD (D-24, issue #39).
      - name: Compatibilidad con el release anterior
        run: scripts/previous-release.sh
      # Desde el checkout limpio: la imagen se arma solo con lo versionado.
      - name: Imagen de Docker
        run: docker build -t cocos:ci .
      # Esa imagen con Docker Compose, Postgres 18 y el bootstrap, por los pasos de remote.sh, y
      # deploy/smoke.mjs contra ella: el flujo de órdenes dos veces y las lecturas (D-29, issue #51).
      - name: Smoke funcional contra la imagen
        run: deploy/lightsail/smoke-docker.sh cocos:ci
