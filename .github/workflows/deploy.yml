# Deploy en AWS Lightsail por versión (D-29, issues #30 y #34): solo al publicar un GitHub
# Release con tag vX.Y.Z (gh release create vX.Y.Z --target main --generate-notes). Un merge a
# main corre solo el CI. Un servidor, dos entornos (proyectos de Docker Compose cocos-staging y
# cocos-production, cada uno con su Postgres), detrás de Caddy con HTTPS. Cuatro etapas:
#   gate        el tag es vX.Y.Z, apunta al commit del release, ese commit está en main y su
#               check "ci" terminó en verde (deploy/release-gate.sh). Si no, el job queda en rojo
#               con el motivo y no se construye ni se despliega nada.
#   image       construye la imagen una sola vez, la publica en GHCR etiquetada con el SHA y con
#               la versión, y entrega su digest (deploy/image-digest.sh): la referencia inmutable.
#   staging     despliega esa imagen, por digest, por SSH (deploy/lightsail/deploy.sh).
#   production  la misma imagen, por el mismo digest, solo si staging terminó en verde. Publicar
#               el release es la aprobación: el environment no tiene reviewers obligatorios (no
#               se puede en un repo privado con plan Pro); se restringe a tags v*.
# En cada entorno, en orden: lo que atiende (release e imagen, del servidor); el commit tiene que
# descender de ese release (deploy/release-check.sh before: un re-run del workflow de un release
# viejo no pisa uno más nuevo; el mismo commit pasa); bajar la imagen con el GITHUB_TOKEN del job
# por stdin, sin que quede en el servidor; el bootstrap con la imagen nueva y la API anterior
# atendiendo; el cambio de la API; /health por la URL pública tiene que atender el commit
# (release-check.sh after); el smoke funcional por esa URL (deploy/smoke.mjs, issue #51): en
# staging el flujo de órdenes completo, con un usuario que existe solo ahí (deploy.sh smoke-user,
# antes del cambio), y en producción solo lecturas. Si el cambio, /health o el smoke fallan, el
# entorno vuelve solo a la imagen y el release anteriores y el job queda en rojo: un staging en
# rojo deja producción sin desplegar. La primera vez: deploy/lightsail/setup.sh
# en el servidor y los secretos LIGHTSAIL_* de cada environment (docs/api/operacion.md).
# No hay deploy manual desde acá: un commit sin release, fuera de main o sin el CI en verde no
# se despliega.
name: deploy

on:
  release:
    types: [published]

permissions:
  contents: read

# Concurrencia por entorno, en cada job de deploy (staging y production), no del workflow: un
# grupo del workflow lo retendría la corrida entera, y el staging de un release no correría
# mientras la producción del anterior siguiera desplegándose. En cada entorno, un deploy a la
# vez, sin cortar uno en curso: cortarlo a mitad del bootstrap no rompe nada (es una
# transacción), pero deja un deploy fallido que hay que mirar. queue: max deja esperar a todos
# los pendientes, en orden de llegada: con la cola por defecto (single) cada pendiente nuevo
# cancela al anterior, y un re-run del workflow de un release viejo que llega mientras otro
# deploy corre cancelaría el deploy pendiente de un release más nuevo; después el gate frena al
# viejo y ese release queda sin desplegar.

# El commit del release (en un evento release, github.sha es el commit del tag; un re-run
# conserva el del evento original) y su tag.
env:
  SHA: ${{ github.sha }}
  TAG: ${{ github.event.release.tag_name }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
    steps:
      # Con la historia completa: el gate busca el tag y origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - name: Versión de main con ci en verde
        run: deploy/release-gate.sh
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      # El commit del release, no el último de main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - name: Login en GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir la imagen
        run: docker build -t "$IMAGE:$SHA" -t "$IMAGE:$TAG" .
      - name: Publicar la imagen
        run: docker push "$IMAGE:$SHA"
      - name: Publicar la etiqueta de la versión
        run: docker push "$IMAGE:$TAG"
      # Las etiquetas se pueden sobrescribir (otra corrida del mismo release, u otro release del
      # mismo commit); el digest no.
      - name: Digest de la imagen publicada
        id: digest
        run: deploy/image-digest.sh
    outputs:
      ref: ${{ steps.digest.outputs.ref }}

  staging:
    needs: image
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
      queue: max
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: https://staging.18-227-203-30.sslip.io
    env:
      ENVIRONMENT: staging
      URL: https://staging.18-227-203-30.sslip.io
      IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      # Con la historia completa: el gate compara el commit con el release que atiende.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      # El smoke (deploy/smoke.mjs) corre con Node, sin dependencias.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Los secretos del environment, solo en este paso: la clave y el host quedan en
      # $RUNNER_TEMP, que GitHub vacía al terminar el job.
      - name: Acceso SSH al servidor
        run: deploy/lightsail/deploy.sh access
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
      - name: Release que atiende
        id: serving
        run: deploy/lightsail/deploy.sh current
      - name: El commit desciende del release actual
        run: deploy/release-check.sh before
        env:
          CURRENT: ${{ steps.serving.outputs.release }}
          FIRST_DEPLOY: ${{ steps.serving.outputs.first }}
      - name: Bajar la imagen
        run: deploy/lightsail/deploy.sh pull
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Antes de cambiar, con la API anterior atendiendo: si falla, no cambió nada y no hay
      # nada que volver (el paso Cambiar de versión no corre).
      - name: Bootstrap de la base
        run: deploy/lightsail/deploy.sh bootstrap
      # Antes del cambio, con la base ya migrada: si falla, no cambió nada. Solo en staging: en
      # producción el usuario del smoke no existe.
      - name: Usuario del smoke
        id: smoke
        run: deploy/lightsail/deploy.sh smoke-user
      - name: Cambiar de versión
        id: deploy
        run: deploy/lightsail/deploy.sh switch
      - name: /health atiende el commit
        run: deploy/release-check.sh after
      # El flujo crítico por la URL pública: si falla, vuelve a la versión anterior.
      - name: Smoke funcional
        run: deploy/smoke.mjs write
        env:
          SMOKE_USERID: ${{ steps.smoke.outputs.userid }}
      # Si algo falló desde que empezó el cambio: el cambio mismo (la API nueva no quedó sana) o
      # las verificaciones de después (/health o el smoke). remote.sh mira el estado del servidor: si el cambio falló
      # antes de tocar la API, sigue la anterior y solo verifica.
      - name: Volver a la versión anterior
        if: failure() && steps.deploy.outcome != 'skipped'
        run: deploy/lightsail/deploy.sh rollback
        env:
          PREVIOUS_IMAGE: ${{ steps.serving.outputs.image }}
          PREVIOUS_RELEASE: ${{ steps.serving.outputs.release }}
          FIRST_DEPLOY: ${{ steps.serving.outputs.first }}

  production:
    needs: [image, staging]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
      queue: max
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://18-227-203-30.sslip.io
    env:
      ENVIRONMENT: production
      URL: https://18-227-203-30.sslip.io
      IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      # Con la historia completa: el gate compara el commit con el release que atiende.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      # El smoke (deploy/smoke.mjs) corre con Node, sin dependencias.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Los secretos del environment, solo en este paso: la clave y el host quedan en
      # $RUNNER_TEMP, que GitHub vacía al terminar el job.
      - name: Acceso SSH al servidor
        run: deploy/lightsail/deploy.sh access
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
      - name: Release que atiende
        id: serving
        run: deploy/lightsail/deploy.sh current
      - name: El commit desciende del release actual
        run: deploy/release-check.sh before
        env:
          CURRENT: ${{ steps.serving.outputs.release }}
          FIRST_DEPLOY: ${{ steps.serving.outputs.first }}
      - name: Bajar la imagen
        run: deploy/lightsail/deploy.sh pull
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Antes de cambiar, con la API anterior atendiendo: si falla, no cambió nada y no hay
      # nada que volver (el paso Cambiar de versión no corre).
      - name: Bootstrap de la base
        run: deploy/lightsail/deploy.sh bootstrap
      - name: Cambiar de versión
        id: deploy
        run: deploy/lightsail/deploy.sh switch
      - name: /health atiende el commit
        run: deploy/release-check.sh after
      # Solo lecturas: en producción el smoke no escribe órdenes.
      - name: Smoke de solo lectura
        run: deploy/smoke.mjs read
      # Si algo falló desde que empezó el cambio: el cambio mismo (la API nueva no quedó sana) o
      # las verificaciones de después (/health o el smoke). remote.sh mira el estado del servidor: si el cambio falló
      # antes de tocar la API, sigue la anterior y solo verifica.
      - name: Volver a la versión anterior
        if: failure() && steps.deploy.outcome != 'skipped'
        run: deploy/lightsail/deploy.sh rollback
        env:
          PREVIOUS_IMAGE: ${{ steps.serving.outputs.image }}
          PREVIOUS_RELEASE: ${{ steps.serving.outputs.release }}
          FIRST_DEPLOY: ${{ steps.serving.outputs.first }}
