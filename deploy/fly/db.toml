# Postgres 18 en Fly.io (D-29): la imagen oficial, la misma que docker compose y el CI, con un
# volumen. Sin servicios públicos: solo la alcanza la red privada de la organización, como
# cocos-challenge-a-db.internal:5432. Se despliega una vez, desde deploy/fly/setup.sh.
app = "cocos-challenge-a-db"
primary_region = "gru"

[build]
  image = "postgres:18"

[env]
  POSTGRES_USER = "postgres"
  POSTGRES_DB = "cocos"

[mounts]
  source = "pgdata"
  destination = "/var/lib/postgresql"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
