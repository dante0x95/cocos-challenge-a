# Postgres 18 de staging en Fly.io (D-29, issue #13): igual que db.toml, para la app de staging.
# Solo la alcanza la red privada, como cocos-challenge-a-staging-db.internal:5432.
app = "cocos-challenge-a-staging-db"
primary_region = "gru"

[build]
  image = "postgres:18"

[env]
  POSTGRES_USER = "postgres"
  POSTGRES_DB = "cocos"

[mounts]
  source = "pgdata"
  destination = "/var/lib/postgresql"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
