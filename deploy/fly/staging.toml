# Staging en Fly.io (D-29, issue #13): la misma configuración que fly.toml (producción) con otra
# app y otra base. Recibe cada commit de main antes que producción, con la misma imagen de GHCR.
app = "cocos-challenge-a-staging"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Migraciones y funciones en una transacción, antes de cambiar de versión y con la API
  # anterior todavía atendiendo (D-23, D-24). Si el bootstrap falla, sale con 1, el deploy se
  # corta y no cambia nada. Sin calentamiento ni versión del cálculo: corto y acotado.
  release_command = "node dist/db/bootstrap.js"
  release_command_timeout = "5m"
  # Las máquinas nuevas reciben tráfico solo si pasan el check de /health; si no, el deploy
  # falla y siguen atendiendo las anteriores.
  strategy = "bluegreen"

[env]
  PORT = "3000"
  PG_POOL_MAX = "10"
  PG_CONNECT_TIMEOUT_MS = "2000"
  # Limpieza de idempotencia dentro del proceso de la API. El job es idempotente y con try-lock
  # por usuario: que dos máquinas lo corran a la vez (bluegreen) solo duplica trabajo.
  JOBS_ENABLED = "true"

[http_service]
  internal_port = 3000
  force_https = true
  # Una máquina siempre prendida: el job corre dentro del proceso y la primera request no
  # espera un arranque en frío.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "10s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
